name: Apply v3.0 release

on:
  push:
    branches: [agent/v3.0-oauth-private-analytics]
    paths:
      - '.release/v30.part.*'
      - '.github/workflows/apply-v30.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3.0-oauth-private-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore and apply OAuth release
        run: |
          cat .release/v30.part.* | base64 --decode > /tmp/v30-release.tar.gz
          tar -xzf /tmp/v30-release.tar.gz
          rm -f .release/v30.part.*
          python .release/apply_v30.py
          npm run verify
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Auto Resume v3.0"
          git push origin HEAD:agent/v3.0-oauth-private-analytics

# Separate trigger commit ensures GitHub registers this new workflow.
