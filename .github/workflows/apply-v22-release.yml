name: Apply Auto Resume v2.2

on:
  push:
    branches: [agent/v2.2-pwa-workspace]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply and verify v2.2
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .release/v22.part.00 ]]; then
            echo "Release archive already applied."
            exit 0
          fi
          cat .release/v22.part.* | base64 --decode > /tmp/v22-patch.tar.gz
          echo "5455d571759a7b22645778de3f5a72815184949ee278c8ff513d163c79a9b99f  /tmp/v22-patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/v22-patch.tar.gz
          npm run verify
          rm -rf .release .github/workflows/apply-v22-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Auto Resume v2.2"
          git push origin "HEAD:${TARGET_BRANCH}"
