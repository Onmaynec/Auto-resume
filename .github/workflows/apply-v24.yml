name: Apply v2.4 release

on:
  pull_request:
    branches: [main]
    paths:
      - '.release/v24.part.*'
      - '.github/workflows/apply-v24.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v2.4-docx-markdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply release patch and verify
        run: |
          cat .release/v24.part.* | base64 --decode > /tmp/v24-patch.tar.gz
          tar -xzf /tmp/v24-patch.tar.gz
          rm -f .release/v24.part.* .release/v24-patch.tar.gz .github/workflows/apply-v24.yml
          rmdir .release 2>/dev/null || true
          npm run verify
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Auto Resume v2.4"
          git push origin HEAD:${{ github.head_ref }}
