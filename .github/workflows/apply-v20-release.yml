name: Apply Auto Resume v2.0

on:
  push:
    branches: [agent/v2.0-job-matching-share]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply and verify release
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .release/v20.part.00 ]]; then
            echo "Release archive already applied."
            exit 0
          fi
          cat .release/v20.part.* | base64 --decode > /tmp/v20-release.tar.gz
          echo "79f79dfc6dc76d592b16d582c38de665f27dba7b590196070a6951551ac5673b  /tmp/v20-release.tar.gz" | sha256sum --check -
          tar -xzf /tmp/v20-release.tar.gz
          npm run verify
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Auto Resume v2.0"
          git push origin "HEAD:${TARGET_BRANCH}"
