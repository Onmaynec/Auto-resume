name: Cleanup merged agent branch

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/cleanup-branch ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged agent branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          head_ref="$PR_HEAD_REF"
          head_repo="$PR_HEAD_REPO"

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            head_ref="${COMMENT_BODY#/cleanup-branch }"
            head_ref="$(printf '%s' "$head_ref" | xargs)"
            head_repo="$REPOSITORY"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            pulls_json=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls")

            readarray -t pr_data < <(python -c '
import json, sys
pulls = json.load(sys.stdin)
merged = next((pr for pr in pulls if pr.get("merged_at")), None)
if merged:
    print(merged.get("head", {}).get("ref", ""))
    print(merged.get("head", {}).get("repo", {}).get("full_name", ""))
' <<< "$pulls_json")
            head_ref="${pr_data[0]:-}"
            head_repo="${pr_data[1]:-}"
          fi

          if [[ "$head_repo" != "$REPOSITORY" || "$head_ref" != agent/* ]]; then
            echo "No same-repository agent branch to delete."
            exit 0
          fi

          status=$(curl --silent --output /tmp/delete-response --write-out '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/git/refs/heads/$head_ref")

          if [[ "$status" == "204" || "$status" == "404" || "$status" == "422" ]]; then
            echo "Branch cleanup completed with HTTP $status."
            exit 0
          fi

          cat /tmp/delete-response
          exit 1
