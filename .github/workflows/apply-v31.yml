name: Apply v3.1 integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v3.1-releases-auto-update'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3.1-releases-auto-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate update UI and verify release
        run: |
          python .release/apply_v31.py
          npm run verify
      - name: Commit verified v3.1 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Auto Resume v3.1"
          git push origin HEAD:agent/v3.1-releases-auto-update
