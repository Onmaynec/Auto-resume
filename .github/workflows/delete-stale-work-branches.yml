name: Delete stale work branches

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/v2.2-pwa-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed agent branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in agent/v2.2-pwa-workspace agent/github-auto-resume; do
            encoded_ref=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            status=$(curl --silent --output /tmp/delete-response --write-out '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/git/refs/heads/$encoded_ref")
            if [[ "$status" != "204" && "$status" != "404" && "$status" != "422" ]]; then
              echo "Failed to delete $branch with HTTP $status"
              cat /tmp/delete-response
              exit 1
            fi
            echo "$branch cleanup completed with HTTP $status"
          done
