name: Delete v1.1 work branch

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.head_ref == 'agent/v1.1-resume-workflow' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/delete-response --write-out '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/git/refs/heads/$HEAD_REF")
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            cat /tmp/delete-response
            exit 1
          fi
          echo "Deleted $HEAD_REF with HTTP $status."
