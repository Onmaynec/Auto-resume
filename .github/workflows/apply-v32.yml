name: Apply v3.2 infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - .release/apply_v32.py
      - .github/workflows/apply-v32.yml
      - api/_store.js
      - api/_profile-gateway.js
      - api/_session-state.js
      - api/auth/session.js
      - tests/store.test.mjs
      - tests/profile-gateway.test.mjs
      - tests/session-state.test.mjs
      - tests/update.test.mjs
      - tests/v31-release.test.mjs
      - tests/v32-infrastructure.test.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v3.2-redis-rate-limit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3.2-redis-rate-limit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate distributed infrastructure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.release/apply_v32.py')
          value = path.read_text(encoding='utf-8')
          value = value.replace(
              "re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)",
          )
          path.write_text(value, encoding='utf-8')
          PY
          python .release/apply_v32.py
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/THREAT_MODEL.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          npm run verify
      - name: Commit verified v3.2 release
        run: |
          rm -f .release/apply_v32.py .github/workflows/apply-v32.yml
          rmdir .release 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Auto Resume v3.2"
          git push origin HEAD:agent/v3.2-redis-rate-limit
